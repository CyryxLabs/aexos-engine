name: B0P Darwin Offline Double Build

on:
  push:
    branches:
      - codex/cerberus-knowledge-plane
    paths:
      - .github/workflows/b0p-darwin-double-build.yml

permissions:
  contents: read

jobs:
  darwin:
    name: darwin-arm64-none-node-v24.19.0
    runs-on: macos-15
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '13.5'
    steps:
      - name: Acquire exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$ImageOS" = macos15
          test "$ImageVersion" = 20260727.0256.1
          test "$(sw_vers -productVersion)" = 15.7.7
          test "$(sw_vers -buildVersion)" = 24G720
          test "$(uname -r)" = 24.6.0
          test "$(uname -m)" = arm64
          curl --fail --location --silent --show-error \
            https://nodejs.org/dist/v24.19.0/node-v24.19.0.tar.gz \
            --output "$RUNNER_TEMP/node-v24.19.0.tar.gz"
          test "$(stat -f %z "$RUNNER_TEMP/node-v24.19.0.tar.gz")" = 112888473
          test "$(shasum -a 256 "$RUNNER_TEMP/node-v24.19.0.tar.gz" | awk '{print $1}')" = 16fe258006a6e86844fbe05b3b5e1e5623ca8d3da54e32d98d9e83234bf25b01

      - name: Execute two independent offline static builds
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/b0p-node-source"
          evidence_root="$RUNNER_TEMP/b0p-build-evidence"
          sdk_root="$(xcrun --sdk macosx --show-sdk-path)"
          test "$(xcrun --sdk macosx --show-sdk-version)" = 15.5
          test -d "$sdk_root/usr/include"
          mkdir -p "$evidence_root"
          for build_number in 1 2; do
            printf 'B0P_BUILD_%s_BEGIN\n' "$build_number"
            rm -rf "$source_root"
            mkdir -p "$source_root"
            tar -xzf "$RUNNER_TEMP/node-v24.19.0.tar.gz" --strip-components=1 -C "$source_root"
            if ! /usr/bin/sandbox-exec -p '(version 1)(deny network*)(allow default)' \
              /usr/bin/env -i PATH=/usr/bin:/bin HOME=/tmp \
              DEVELOPER_DIR="$DEVELOPER_DIR" MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
              SDKROOT="$sdk_root" \
              CFLAGS="-isysroot $sdk_root" CXXFLAGS="-isysroot $sdk_root" \
              LDFLAGS="-isysroot $sdk_root" \
              CC="$(xcrun --find clang)" CXX="$(xcrun --find clang++)" PYTHON=/usr/bin/python3 \
              /bin/bash -c "cd '$source_root' && ./configure --enable-static --without-npm --without-corepack && make -j4" \
              >"$evidence_root/build-$build_number.log" 2>&1; then
              tail -200 "$evidence_root/build-$build_number.log" >&2
              exit 1
            fi
            archive="$(find "$source_root/out/Release" -type f -name 'libnode.a' -print -quit)"
            test -n "$archive"
            test "$(find "$source_root/out/Release" -type f -name 'libnode.a' | wc -l | tr -d ' ')" = 1
            archive_sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
            archive_bytes="$(stat -f %z "$archive")"
            xcrun ar t "$archive" | LC_ALL=C sort >"$evidence_root/archive-members-$build_number.txt"
            xcrun nm -A -P "$archive" | LC_ALL=C sort >"$evidence_root/archive-symbols-$build_number.txt"
            find "$source_root/out/Release" -type f \( -name '*.o' -o -name '*.a' \) -print0 \
              | LC_ALL=C sort -z \
              | while IFS= read -r -d '' file; do
                  relative="${file#"$source_root/"}"
                  printf '%s\t%s\t%s\n' "$relative" "$(stat -f %z "$file")" "$(shasum -a 256 "$file" | awk '{print $1}')"
                done >"$evidence_root/object-set-$build_number.txt"
            printf '%s\n%s\n%s\n%s\n%s\n' \
              "$archive_sha" "$archive_bytes" \
              "$(shasum -a 256 "$evidence_root/archive-members-$build_number.txt" | awk '{print $1}')" \
              "$(shasum -a 256 "$evidence_root/archive-symbols-$build_number.txt" | awk '{print $1}')" \
              "$(shasum -a 256 "$evidence_root/object-set-$build_number.txt" | awk '{print $1}')" \
              >"$evidence_root/result-$build_number.txt"
            printf 'B0P_BUILD_%s_END\n' "$build_number"
          done
          cmp "$evidence_root/result-1.txt" "$evidence_root/result-2.txt"
          result=($(cat "$evidence_root/result-1.txt"))
          printf 'B0P_DOUBLE_BUILD_EVIDENCE_BEGIN\n'
          printf '{"schemaVersion":"aexos.b0p-offline-double-build/v1","launcherTupleId":"darwin-arm64-none-node-v24.19.0","imageVersion":"%s","archiveSha256":"%s","archiveBytes":%s,"memberInventorySha256":"%s","symbolInventorySha256":"%s","objectSetSha256":"%s","objectRecordCount":%s,"buildCount":2,"network":"sandbox-exec-deny-network","byteIdentical":true,"result":"PASS"}\n' \
            "$ImageVersion" "${result[0]}" "${result[1]}" "${result[2]}" "${result[3]}" "${result[4]}" \
            "$(wc -l <"$evidence_root/object-set-1.txt" | tr -d ' ')"
          printf 'B0P_DOUBLE_BUILD_EVIDENCE_END\n'
