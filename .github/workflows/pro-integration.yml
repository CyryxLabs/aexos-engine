# ADR-AEX-011 / ACL.12: public contracts, not paid-provider certification.
# Called unconditionally by CI on every main PR/push, including fork PRs.
name: Pro Integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pro-tests:
    name: Core / paid-artifact boundary contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public Core
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install locked Core dependencies
        run: npm ci

      - name: Run public distribution contract suites
        run: >-
          node node_modules/jest/bin/jest.js --runInBand --runTestsByPath
          tests/pro/pro-detector.test.js
          tests/pro/pro-updater.test.js
          tests/unit/licensing/paid-squad-artifact.test.js
          tests/installer/pro-setup-signed-artifact.test.js
          tests/installer/pro-setup-target-install.test.js
          tests/installer/pro-scaffolder.test.js
          tests/cli/core-package-boundary.test.js
          --json --outputFile=contract-results.json

      - name: Require executed tests with no skips
        run: node scripts/ci/assert-contract-results.js contract-results.json 7

      - name: Validate public npm payload
        run: npm run validate:core-package

      - name: Validate workflow failure contracts
        run: node node_modules/jest/bin/jest.js --runInBand --runTestsByPath tests/unit/ci/pro-distribution-workflows.test.js

      - name: State verification boundary
        run: echo "Public Core and fixture security contracts passed. Hosted payment/download/install, private runtime and commercial release remain unverified."
