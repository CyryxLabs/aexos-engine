name: Legacy release route retired
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
permissions: {}
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse retired release route
        run: |
          echo 'This release route is retired. Use npm-publish.yml prepare, review its exact immutable locator, then publish that locator.'
          exit 1
