name: Publish to NPM
# AEX-4.16: one serialized writer; immutable prepare and explicit publish runs.
on:
  release:
    types: [published]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      operation:
        description: 'Prepare a candidate, or publish its reviewed immutable locator'
        required: true
        default: prepare
        type: choice
        options: [prepare, publish]
      source_sha:
        description: 'Prepare only: exact approved 40-character source commit'
        required: false
        type: string
      candidate_spec:
        description: 'Prepare only: JSON packageKeys, channel, release and dependencies'
        required: false
        type: string
      locator:
        description: 'Publish only: reviewed exact source/run/attempt/artifact/manifest locator JSON'
        required: false
        type: string
      authentication:
        description: 'Publish only: one provisioned auth strategy, never automatic fallback'
        required: true
        default: oidc
        type: choice
        options: [oidc, token]
concurrency:
  group: aexos-public-release
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  HUSKY: '0'
  AEXOS_RELEASE_OPERATION: ${{ inputs.operation }}
  AEXOS_SOURCE_SHA: ${{ inputs.source_sha }}
  AEXOS_CANDIDATE_SPEC: ${{ inputs.candidate_spec }}
  AEXOS_CANDIDATE_LOCATOR: ${{ inputs.locator }}
jobs:
  retired:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse unsealed event route
        run: |
          echo 'Tag/release publishing is retired. Prepare and review an immutable candidate in npm-publish.yml, then explicitly publish its locator.'
          exit 1
  prepare:
    name: Prepare sealed candidate
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AEXOS_SOURCE_DIR: ${{ github.workspace }}/payload
    steps:
      - name: Require exact payload SHA
        run: |
          [[ "$AEXOS_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$AEXOS_SOURCE_SHA" == "$GITHUB_SHA" ]] || exit 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: payload
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '20.20.2'
          package-manager-cache: false
      - name: Record Node 20
        run: echo "AEXOS_NODE_20=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Record Node 22
        run: echo "AEXOS_NODE_22=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Record fixed toolchain
        run: |
          echo "AEXOS_NODE_24=$(command -v node)" >> "$GITHUB_ENV"
          echo "AEXOS_NPM_PATH=$(realpath "$(command -v npm)")" >> "$GITHUB_ENV"
          echo "AEXOS_PYTHON_PATH=$(command -v python)" >> "$GITHUB_ENV"
          echo "AEXOS_CANDIDATE_DIR=$RUNNER_TEMP/sealed-candidate" >> "$GITHUB_ENV"
          echo "AEXOS_RELEASE_EVIDENCE_DIR=$RUNNER_TEMP/sealed-evidence" >> "$GITHUB_ENV"
          node --version
          npm --version
      - name: Install controller dependencies
        working-directory: controller
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish safety gate (INS-4.10), fixed gates, pack and installed verification
        id: candidate
        working-directory: controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-sealed-release.js prepare
      - name: Persist immutable candidate
        id: sealed
        uses: actions/upload-artifact@v7
        with:
          name: aexos-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed-candidate/*
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Reviewable candidate locator
        env:
          SOURCE: ${{ steps.candidate.outputs.source_sha }}
          MANIFEST: ${{ steps.candidate.outputs.manifest_sha256 }}
          ARTIFACT_ID: ${{ steps.sealed.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.sealed.outputs.artifact-digest }}
        run: |
          node -e 'const e=process.env; const locator={sourceSha:e.SOURCE,producerRunId:Number(e.GITHUB_RUN_ID),producerRunAttempt:Number(e.GITHUB_RUN_ATTEMPT),artifactId:Number(e.ARTIFACT_ID),artifactDigest:e.ARTIFACT_DIGEST.startsWith("sha256:")?e.ARTIFACT_DIGEST:"sha256:"+e.ARTIFACT_DIGEST,manifestSha256:e.MANIFEST};require("fs").appendFileSync(e.GITHUB_STEP_SUMMARY,"Prepared only; review exact candidate before publication.\n\n```json\n"+JSON.stringify(locator,null,2)+"\n```\n")'
  publish:
    name: Publish sealed transaction
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '20.20.2'
          package-manager-cache: false
      - name: Record Node 20
        run: echo "AEXOS_NODE_20=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Record Node 22
        run: echo "AEXOS_NODE_22=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Record fixed toolchain
        run: |
          echo "AEXOS_NODE_24=$(command -v node)" >> "$GITHUB_ENV"
          echo "AEXOS_NPM_PATH=$(realpath "$(command -v npm)")" >> "$GITHUB_ENV"
          echo "AEXOS_PYTHON_PATH=$(command -v python)" >> "$GITHUB_ENV"
          echo "AEXOS_RELEASE_EVIDENCE_DIR=$RUNNER_TEMP/sealed-evidence" >> "$GITHUB_ENV"
          node --version
          npm --version
      - name: Install controller dependencies
        working-directory: controller
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate exact candidate and prepare durable intent
        working-directory: controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-sealed-release.js preflight
      - name: Persist immutable intent before release effects
        id: intent
        uses: actions/upload-artifact@v7
        with:
          name: aexos-release-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed-evidence/intent.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Reconcile, publish sealed bytes and verify all selected effects
        working-directory: controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AEXOS_RELEASE_AUTH: ${{ inputs.authentication }}
          NODE_AUTH_TOKEN: ${{ inputs.authentication == 'token' && secrets.NPM_TOKEN_AEXOS || '' }}
          AEXOS_INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
          AEXOS_INTENT_ARTIFACT_DIGEST: ${{ steps.intent.outputs.artifact-digest }}
        run: node scripts/run-sealed-release.js publish
      - name: Persist terminal outcome without masking transaction failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aexos-release-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed-evidence/receipt.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
