name: Retired Public Pro Publication

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Refuse public paid-package publication
    runs-on: ubuntu-latest
    steps:
      - name: Require the approved private distribution path
        run: |
          echo "::error::Public Pro publication is retired under ADR-AEX-011. Approved immutable artifacts require authenticated private delivery and ACL.5/ACL.6 acceptance. No approved release publisher is available."
          exit 1
