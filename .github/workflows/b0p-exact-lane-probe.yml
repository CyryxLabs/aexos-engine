name: B0P Exact Lane Probe

on:
  push:
    branches:
      - codex/cerberus-knowledge-plane
    paths:
      - .github/workflows/b0p-exact-lane-probe.yml

permissions:
  contents: read

concurrency:
  group: b0p-exact-lane-probe
  cancel-in-progress: false

jobs:
  windows:
    name: win22/20260818.277@20260818.277.1
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Assert exact Windows lane
        shell: pwsh
        run: |
          $build = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $observed = [ordered]@{
            runnerOS = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            imageOS = $env:ImageOS
            imageVersion = $env:ImageVersion
            windowsBuild = "10.0.$($build.CurrentBuildNumber).$($build.UBR)"
            nodeVersion = node --version
          }
          $observed | ConvertTo-Json -Compress
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'B0P_WINDOWS_RUNNER_IDENTITY_MISMATCH' }
          if ($env:ImageOS -ne 'win22' -or $env:ImageVersion -ne '20260818.277.1') { throw 'B0P_WINDOWS_IMAGE_MISMATCH' }
          if ($observed.windowsBuild -ne '10.0.20348.5499') { throw 'B0P_WINDOWS_BUILD_MISMATCH' }
          if ($observed.nodeVersion -ne 'v24.19.0') { throw 'B0P_WINDOWS_NODE_MISMATCH' }

  linux:
    name: ubuntu24/20260816.277@20260816.277.1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert exact Linux lane
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          printf '{"runnerOS":"%s","runnerArch":"%s","imageOS":"%s","imageVersion":"%s","prettyName":"%s","kernel":"%s","nodeVersion":"%s"}\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion" "$PRETTY_NAME" "$(uname -r)" "$(node --version)"
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$ImageOS" = ubuntu24
          test "$ImageVersion" = 20260816.277.1
          test "$PRETTY_NAME" = 'Ubuntu 24.04.4 LTS'
          test "$(uname -r)" = 6.17.0-1022-azure
          test "$(node --version)" = v24.19.0

  darwin:
    name: macos-15-arm64/20260727.0256@20260727.0256.1
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Assert exact Darwin lane
        shell: bash
        run: |
          set -euo pipefail
          printf '{"runnerOS":"%s","runnerArch":"%s","imageOS":"%s","imageVersion":"%s","productVersion":"%s","buildVersion":"%s","kernel":"%s","arch":"%s","nodeVersion":"%s"}\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion" "$(sw_vers -productVersion)" "$(sw_vers -buildVersion)" "$(uname -r)" "$(uname -m)" "$(node --version)"
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$ImageOS" = macos15
          test "$ImageVersion" = 20260727.0256.1
          test "$(sw_vers -productVersion)" = 15.7.7
          test "$(sw_vers -buildVersion)" = 24G720
          test "$(uname -r)" = 24.6.0
          test "$(uname -m)" = arm64
          test "$(node --version)" = v24.19.0
