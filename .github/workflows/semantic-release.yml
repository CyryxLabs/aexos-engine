name: Semantic version proposal
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full reviewed source SHA for read-only version/notes proposal'
        required: true
        type: string
permissions:
  contents: read
jobs:
  proposal:
    runs-on: ubuntu-latest
    steps:
      - name: Validate full source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$SOURCE_SHA" == "$GITHUB_SHA" ]] || exit 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: payload
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Read-only version and notes
        working-directory: controller
        env:
          AEXOS_PROPOSAL_CWD: ${{ github.workspace }}/payload
          AEXOS_PROPOSAL_SHA: ${{ inputs.source_sha }}
        run: node scripts/run-semantic-release.js --dry-run --no-ci
