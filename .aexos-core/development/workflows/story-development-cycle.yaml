workflow:
  id: story-development-cycle
  name: Story Development Cycle
  version: "1.0"
  description: >-
    Ciclo completo de desenvolvimento de stories. Automatiza o fluxo desde a criação
    até a entrega com quality gate: create → validate → plan → implement → test → QA review.
    Aplicável a projetos greenfield e brownfield.
  type: generic
  project_types:
    - greenfield
    - brownfield
    - feature-development
    - bug-fix
    - enhancement

  metadata:
    elicit: true
    confirmation_required: true

  execution_modes:
    - mode: yolo
      description: Execução autônoma com mínima interação
      prompts: 0-1
    - mode: interactive
      description: Checkpoints de decisão e feedback educacional
      prompts: 5-10
      default: true
    - mode: preflight
      description: Planejamento completo antes da execução - análise upfront de requisitos e dependências
      prompts: "10-15"

  phases:
    - phase_1: Story Creation
    - phase_2: Story Validation
    - phase_3: Implementation Planning
    - phase_4: Implementation
    - phase_5: Test Execution
    - phase_6: QA Review

  sequence:
    - id: create-story
      phase: 1
      phase_name: Story Creation
      agent: sm
      action: create-next-story
      task: create-next-story
      requireAcceptance: true
      dependsOn: []

    - id: validate-story
      phase: 2
      phase_name: Story Validation
      agent: po
      action: validate-next-story
      task: validate-next-story
      requireAcceptance: true
      dependsOn:
        - create-story

    - id: plan-implementation
      phase: 3
      phase_name: Implementation Planning
      agent: architect
      action: plan-create-implementation
      task: plan-create-implementation
      requireAcceptance: true
      dependsOn:
        - validate-story

    - id: implement-story
      phase: 4
      phase_name: Story Implementation
      agent: dev
      action: dev-develop-story
      task: dev-develop-story
      requireAcceptance: true
      dependsOn:
        - plan-implementation

    - id: run-tests
      phase: 5
      phase_name: Test Execution
      agent: qa
      action: qa-run-tests
      task: qa-run-tests
      requireAcceptance: true
      dependsOn:
        - implement-story

    - id: review-story
      phase: 6
      phase_name: Independent QA Review
      agent: qa
      action: qa-review-story
      task: qa-review-story
      requireAcceptance: true
      dependsOn:
        - run-tests

  flow_diagram: |
    ```mermaid
    graph TD
        A[Start: Story Development Cycle] --> B[sm: Criar próxima story]
        B --> C[po: Validar story - 10 checks]

        C --> D{Validação OK?}
        D -->|Não| E[Feedback para SM]
        E --> B
        D -->|Sim| F[dev: Implementar story]

        F --> G[qa: Review + Quality Gate]

        G --> H{Quality Gate OK?}
        H -->|Não| I[Feedback para Dev]
        I --> F
        H -->|Sim| J[Story Done!]

        J --> K{Mais stories?}
        K -->|Sim| B
        K -->|Não| L[Ciclo Completo]

        style L fill:#90EE90
        style J fill:#90EE90
        style B fill:#87CEEB
        style C fill:#FFE4B5
        style F fill:#98FB98
        style G fill:#DDA0DD
        style E fill:#FFB6C1
        style I fill:#FFB6C1
    ```

  decision_guidance:
    when_to_use:
      - Desenvolvimento de qualquer story (greenfield ou brownfield)
      - Ciclo completo com validação e quality gate
      - Quando precisa de rastreabilidade do processo
      - Equipes que seguem processo ágil estruturado

    when_not_to_use:
      - Hotfixes urgentes (use fluxo simplificado)
      - Spikes/POCs exploratórios
      - Tasks puramente técnicas sem story

  handoff_prompts:
    story_created: |
      Story criada com sucesso!
      ID: {{story_id}}
      Título: {{story_title}}
      Status: Draft

      Prosseguindo para validação com PO...

    story_validated: |
      Story validada pelo PO!
      Checks aprovados: {{passed_checks}}/10
      Status: Ready

      Story pronta para implementação...

    story_implemented: |
      Story implementada pelo Dev!
      Arquivos modificados: {{file_count}}
      Testes: {{test_status}}
      Commits: {{commit_count}}
      Status: In Review

      Iniciando QA review...

    story_approved: |
      Story aprovada no Quality Gate!
      Status: Done

      Ciclo completo para story {{story_id}}.
      Execute novamente para próxima story.

    story_rejected_validation: |
      Story rejeitada na validação.
      Issues encontradas: {{issue_list}}

      Retornando para SM ajustar...

    story_rejected_qa: |
      Story rejeitada no Quality Gate.
      Issues para resolver: {{issue_list}}

      Retornando para Dev corrigir...

metadata:
  author: Zeus (AEXOS Master)
  created_date: 2025-01-30
  version: 1.0.0
  tags:
    - story
    - development-cycle
    - quality-gate
    - agile
    - generic
